  <script type="text/babel">
// components/Compass.jsx
const { useState, useEffect, useRef, useMemo } = React;

function CompassChart({ result }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && result) window.drawMCChart(ref.current, result);
  }, [result]);
  if (!result) return null;
  return (
    <canvas ref={ref} width={820} height={340}
      style={{width:'100%',height:340,borderRadius:'0 0 9px 9px'}} />
  );
}

function AllocationDonut({ sectorAlloc }) {
  const ref = useRef(null);
  const total = Object.values(sectorAlloc).reduce((a,b)=>a+b,0);
  const entries = Object.entries(sectorAlloc).sort((a,b)=>b[1]-a[1]);

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas || total === 0) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 16, inner = r*0.56;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0F1E38'; ctx.fillRect(0,0,W,H);
    let angle = -Math.PI/2;
    entries.forEach(([sec, val]) => {
      const slice = (val/total)*2*Math.PI;
      const color = window.SECTOR_META[sec]?.color || '#4070FF';
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,angle,angle+slice);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      angle += slice;
    });
    // Inner hole
    ctx.beginPath();
    ctx.arc(cx,cy,inner,0,2*Math.PI);
    ctx.fillStyle='#0F1E38';
    ctx.fill();
    // Center text
    ctx.fillStyle='#7090B8'; ctx.font='10px DM Sans,sans-serif'; ctx.textAlign='center';
    ctx.fillText('Allocation', cx, cy-4);
    ctx.fillStyle='#DDE8F8'; ctx.font='bold 12px Space Grotesk,sans-serif';
    ctx.fillText(`${entries.length} sectors`, cx, cy+12);
  }, [sectorAlloc]);

  return (
    <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
      <canvas ref={ref} width={160} height={160} style={{flexShrink:0}} />
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:7,paddingTop:8}}>
        {entries.map(([sec, val]) => {
          const pct = total>0 ? val/total*100 : 0;
          const color = window.SECTOR_META[sec]?.color || '#4070FF';
          return (
            <div key={sec} style={{display:'flex',alignItems:'center',gap:7}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:color,flexShrink:0}}></span>
              <span style={{fontSize:11.5,color:'var(--t2)',flex:1}}>{sec}</span>
              <span style={{fontFamily:'var(--f-mono)',fontSize:11,color:'var(--t1)'}}>{pct.toFixed(1)}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Compass({ portfolio, livePrices }) {
  const [profile, setProfile] = useState('moderate');
  const [result, setResult]   = useState(null);
  const [running, setRunning] = useState(false);

  const profiles = [
    { id:'conservative', label:'Conservative', hint:'Low risk, ~12% annual return' },
    { id:'moderate',     label:'Moderate',     hint:'Balanced, ~15% annual return' },
    { id:'aggressive',   label:'Aggressive',   hint:'High risk, ~20% annual return' },
  ];

  function runSim() {
    if (portfolio.length === 0) return;
    setRunning(true);
    setTimeout(() => {
      const r = window.runMonteCarlo(portfolio, livePrices, profile, 1000);
      setResult(r);
      setRunning(false);
    }, 60);
  }

  const hasPortfolio = portfolio.length > 0;
  const initVal = result ? result.initialValue : (
    portfolio.reduce((s,h) => s + (livePrices[h.sym]?.ltp || h.avgPrice)*h.qty, 0)
  );

  return (
    <div className="page fade-up">
      <div className="ph">
        <div>
          <div className="ph-title">Portfolio Compass</div>
          <div className="ph-sub">Monte Carlo 5-year projection · 1,000 simulations · GBM model</div>
        </div>
        {hasPortfolio && (
          <button className="btn btn-primary btn-lg" onClick={runSim} disabled={running}>
            {running
              ? <><span className="pulse">⟳</span> Simulating…</>
              : <>▶ Run Simulation</>}
          </button>
        )}
      </div>

      {!hasPortfolio && (
        <div className="empty" style={{marginTop:60}}>
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="currentColor" strokeWidth="2"/>
            <path d="M24 10v4M24 34v4M10 24h4M34 24h4" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
            <path d="M30 18L22 24l8 6-2-6 2-6z" fill="currentColor"/>
          </svg>
          <div className="empty-title">No portfolio to analyse</div>
          <div className="empty-sub">Add holdings via Trade to run your Compass projection</div>
        </div>
      )}

      {hasPortfolio && (
        <>
          {/* Risk profile */}
          <div className="card card-p">
            <div style={{fontSize:12,color:'var(--t2)',marginBottom:12,fontWeight:500,textTransform:'uppercase',letterSpacing:'.5px'}}>Risk Profile</div>
            <div style={{display:'flex',gap:10,marginBottom:12}}>
              {profiles.map(p => (
                <button key={p.id} className={`risk-btn${profile===p.id?' active':''}`} onClick={()=>setProfile(p.id)}>
                  {p.label}
                </button>
              ))}
            </div>
            <div style={{fontSize:12,color:'var(--t3)'}}>
              {profiles.find(p=>p.id===profile)?.hint} · Based on NSE sector historical data · Simulated via Geometric Brownian Motion
            </div>
          </div>

          {/* Chart */}
          <div className="card" style={{overflow:'hidden'}}>
            <div className="card-head">
              <span className="card-head-title">5-Year Projection — {profile.charAt(0).toUpperCase()+profile.slice(1)} Profile</span>
              {result && <span className="badge badge-b">1,000 runs complete</span>}
            </div>
            {!result && !running && (
              <div className="empty" style={{padding:'60px 24px'}}>
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                  <path d="M4 32L14 18l8 8 14-16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  <circle cx="36" cy="10" r="4" stroke="currentColor" strokeWidth="2"/>
                </svg>
                <div className="empty-sub">Click "Run Simulation" to generate your 5-year projection</div>
              </div>
            )}
            {running && (
              <div className="empty" style={{padding:'60px 24px'}}>
                <div style={{fontFamily:'var(--f-mono)',fontSize:13,color:'var(--accent)',animation:'pulse 1s infinite'}}>
                  Running 1,000 Monte Carlo paths…
                </div>
                <div style={{width:200,height:3,background:'var(--raised)',borderRadius:2,marginTop:12,overflow:'hidden'}}>
                  <div style={{height:'100%',background:'var(--accent)',borderRadius:2,animation:'shimmer 1s infinite',backgroundSize:'200% 100%',backgroundImage:'linear-gradient(90deg,var(--accent) 40%,#7BA7FF 50%,var(--accent) 60%)'}}></div>
                </div>
              </div>
            )}
            {result && <CompassChart result={result} />}
          </div>

          {/* Stats + Allocation */}
          {result && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:18,alignItems:'start'}}>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <div className="stats-grid">
                  {[
                    {
                      label:'Expected Value (P50)',
                      val: fmtLarge(result.stats.median),
                      sub: `+${fmtPct((result.stats.median/initVal-1)*100)} from today`,
                      color:'var(--accent)', up:true
                    },
                    {
                      label:'Best Case (P90)',
                      val: fmtLarge(result.stats.best),
                      sub: `+${fmtPct((result.stats.best/initVal-1)*100)} bull scenario`,
                      color:'var(--green)', up:true
                    },
                    {
                      label:'Worst Case (P10)',
                      val: fmtLarge(result.stats.worst),
                      sub: `${fmtPct((result.stats.worst/initVal-1)*100)} bear scenario`,
                      color: result.stats.worst < initVal ? 'var(--red)' : 'var(--green)',
                      up: result.stats.worst >= initVal
                    },
                    {
                      label:'Value at Risk (5%)',
                      val: fmtLarge(result.stats.var5),
                      sub: `${fmtPct((result.stats.var5/initVal-1)*100)} downside`,
                      color: result.stats.var5 < initVal ? 'var(--red)' : 'var(--t1)',
                      up: result.stats.var5 >= initVal
                    },
                    {
                      label:'Probability of Profit',
                      val: `${result.probProfit.toFixed(1)}%`,
                      sub: `${(100-result.probProfit).toFixed(1)}% chance of loss`,
                      color: result.probProfit >= 50 ? 'var(--green)' : 'var(--red)',
                      up: result.probProfit >= 50
                    },
                    {
                      label:'Expected CAGR',
                      val: `${result.stats.cagr.toFixed(1)}%`,
                      sub: `Compounded annual growth rate`,
                      color: result.stats.cagr >= 0 ? 'var(--green)' : 'var(--red)',
                      up: result.stats.cagr >= 0
                    },
                  ].map(s => (
                    <div key={s.label} className="stat-mini">
                      <div className="stat-mini-label">{s.label}</div>
                      <div className="stat-mini-val" style={{color:s.color}}>{s.val}</div>
                      <div className="stat-mini-sub">{s.sub}</div>
                    </div>
                  ))}
                </div>

                {/* Assumptions */}
                <div style={{background:'var(--raised)',border:'1px solid var(--border)',borderRadius:'var(--r2)',padding:'14px 16px',fontSize:12,color:'var(--t3)',lineHeight:1.7}}>
                  <strong style={{color:'var(--t2)',display:'block',marginBottom:4}}>Model Assumptions</strong>
                  Geometric Brownian Motion (GBM) · {result.wMu.toFixed(1)*100|0}% expected annual return ·{' '}
                  {result.wSigma.toFixed(2)*100|0}% annual volatility · NSE sector-weighted parameters ·
                  Monthly time steps (60) · 1,000 independent paths · No dividends or rebalancing assumed
                </div>
              </div>

              {/* Donut */}
              <div className="card card-p">
                <div style={{fontSize:12,color:'var(--t2)',fontWeight:600,marginBottom:14}}>Portfolio Allocation</div>
                <AllocationDonut sectorAlloc={result.sectorAlloc} />
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

          value={q}
          onChange={e => handleSearch(e.target.value)}
          onBlur={() => setTimeout(()=>setResults([]),150)}
        />
        {results.length > 0 && (
          <div style={{
            position:'absolute',top:'calc(100% + 6px)',left:0,right:0,
            background:'var(--raised)',border:'1px solid var(--border2)',
            borderRadius:'var(--r2)',zIndex:200,
            boxShadow:'0 12px 40px rgba(0,0,0,.6)',overflow:'hidden'
          }}>
            {results.map(s => {
              const lp = livePrices[s.sym] || s;
              return (
                <div key={s.sym}
                  style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                    padding:'9px 14px',cursor:'pointer',borderBottom:'1px solid var(--border)'}}
                  onMouseDown={()=>{ navigate('trade',s.sym); setQ(''); setResults([]); }}>
                  <div>
                    <span style={{fontFamily:'var(--f-head)',fontWeight:700,fontSize:13,color:'var(--t1)'}}>{s.sym}</span>
                    <span style={{fontSize:12,color:'var(--t2)',marginLeft:8}}>{s.name}</span>
                  </div>
                  <div style={{display:'flex',gap:10,alignItems:'center'}}>
                    <span style={{fontFamily:'var(--f-mono)',fontSize:12}}>{fmtPrice(lp.ltp)}</span>
                    <span className={lp.pct>=0?'up':'down'} style={{fontFamily:'var(--f-mono)',fontSize:11}}>{lp.pct>=0?'+':''}{lp.pct.toFixed(2)}%</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* NIFTY pill */}
      <div style={{
        display:'flex',alignItems:'center',gap:7,padding:'5px 12px',
        borderRadius:'var(--r1)',background:'var(--raised)',border:'1px solid var(--border2)',
      }}>
        <span style={{fontSize:10.5,color:'var(--t3)',fontWeight:600,letterSpacing:'.4px'}}>NIFTY 50</span>
        <span style={{fontFamily:'var(--f-mono)',fontSize:12.5,fontWeight:700,color:'var(--t1)'}}>{parseFloat(niftyVal).toLocaleString('en-IN',{minimumFractionDigits:2})}</span>
        <span className={niftyUp?'up':'down'} style={{fontFamily:'var(--f-mono)',fontSize:11}}>
          {niftyUp?'▲':'▼'} {Math.abs((parseFloat(niftyVal)-24835.40)).toFixed(2)}
        </span>
      </div>

      <div className="topbar-right">
        <span className="topbar-time">{time}</span>
        <div className="topbar-btn" title="Notifications">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 2a5 5 0 015 5v3l1 2H2l1-2V7a5 5 0 015-5z" stroke="currentColor" strokeWidth="1.4"/>
            <path d="M6.5 13.5a1.5 1.5 0 003 0" stroke="currentColor" strokeWidth="1.4"/>
          </svg>
        </div>
        <div className="avatar" title="Demo User">U</div>
      </div>
    </div>
  );
}

function Toast({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast toast-${t.type}`}>
          <span>{t.type==='g'?'✓':t.type==='r'?'✕':'ℹ'}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [t, setTweak]   = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState('dashboard');
  const [tradeSym, setTradeSym]   = useState('RELIANCE');
  const [marketSector, setMarketSector] = useState('ALL');

  const [credits,   setCredits]   = useState(() => {
    const s = localStorage.getItem('bzr_credits');
    return s ? parseFloat(s) : parseFloat(TWEAK_DEFAULTS.credits);
  });
  const [portfolio, setPortfolio] = useState(() => {
    const s = localStorage.getItem('bzr_portfolio');
    return s ? JSON.parse(s) : DEMO_PORTFOLIO;
  });
  const [orders,    setOrders]    = useState(() => {
    const s = localStorage.getItem('bzr_orders');
    return s ? JSON.parse(s) : [];
  });
  const [watchlist, setWatchlist] = useState(() => {
    const s = localStorage.getItem('bzr_watchlist');
    return s ? JSON.parse(s) : ['TCS','RELIANCE','HDFCBANK','INFY','BHARTIARTL'];
  });
  const [livePrices, setLivePrices] = useState(buildLivePrices);
  const [toasts, setToasts] = useState([]);

  // Persist state
  useEffect(() => { localStorage.setItem('bzr_credits', credits); }, [credits]);
  useEffect(() => { localStorage.setItem('bzr_portfolio', JSON.stringify(portfolio)); }, [portfolio]);
  useEffect(() => { localStorage.setItem('bzr_orders', JSON.stringify(orders)); }, [orders]);
  useEffect(() => { localStorage.setItem('bzr_watchlist', JSON.stringify(watchlist)); }, [watchlist]);

  // Apply accent color tweak
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', t.accent);
  }, [t.accent]);

  // Live price simulation
  useEffect(() => {
    const interval = setInterval(() => {
      setLivePrices(prev => {
        const next = {};
        Object.keys(prev).forEach(sym => {
          const d = prev[sym];
          const drift = (Math.random() - 0.49) * d.ltp * 0.0018;
          const newLtp = Math.max(d.ltp * 0.5, d.ltp + drift);
          const newChg = newLtp - d.basePrice;
          const newPct = newChg / d.basePrice * 100;
          next[sym] = { ...d, ltp: newLtp, chg: newChg, pct: newPct };
        });
        return next;
      });
    }, t.speed || 3000);
    return () => clearInterval(interval);
  }, [t.speed]);

  function addToast(msg, type='g') {
    const id = Date.now();
    setToasts(prev => [...prev, {id,msg,type}]);
    setTimeout(() => setToasts(prev => prev.filter(t=>t.id!==id)), 3200);
  }

  function navigate(dest, param) {
    if (dest === 'trade')   { setTradeSym(param || 'RELIANCE'); setPage('trade'); }
    else if (dest === 'markets') { setMarketSector(param || 'ALL'); setPage('markets'); }
    else if (dest === 'compass') { setPage('compass'); }
    else setPage(dest);
  }

  function onOrderPlaced({ sym, name, side, qty, price, orderType, sector }) {
    const value = price * qty;
    const now   = new Date();
    const time  = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
                + ' ' + now.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});

    const order = { id: Date.now(), time, sym, name, side, qty, price, orderType, sector, status:'EXECUTED' };
    setOrders(prev => [order, ...prev]);

    if (side === 'BUY') {
      setCredits(c => c - value);
      setPortfolio(prev => {
        const existing = prev.find(h => h.sym === sym);
        if (existing) {
          return prev.map(h => h.sym === sym ? {
            ...h,
            qty: h.qty + qty,
            avgPrice: (h.avgPrice * h.qty + price * qty) / (h.qty + qty)
          } : h);
        }
        return [...prev, { sym, name, qty, avgPrice: price, sector }];
      });
      addToast(`Bought ${qty} ${sym} @ ${fmtPrice(price)}`, 'g');
    } else {
      const proceeds = value;
      setCredits(c => c + proceeds);
      setPortfolio(prev => {
        return prev.map(h => {
          if (h.sym !== sym) return h;
          const newQty = h.qty - qty;
          return newQty <= 0 ? null : { ...h, qty: newQty };
        }).filter(Boolean);
      });
      addToast(`Sold ${qty} ${sym} @ ${fmtPrice(price)}`, 'r');
    }
    navigate('orders');
  }

  function onSell(sym, qty, price) {
    onOrderPlaced({
      sym, name: (window.STOCK_MAP[sym]||{}).name||sym,
      side:'SELL', qty, price, orderType:'MARKET',
      sector: (window.STOCK_MAP[sym]||{}).sector||'IT'
    });
  }

  const openOrderCount = orders.filter(o=>o.status==='OPEN').length;

  function renderPage() {
    switch (page) {
      case 'dashboard':
        return <Dashboard livePrices={livePrices} portfolio={portfolio} credits={credits} navigate={navigate} />;
      case 'markets':
        return <Markets livePrices={livePrices} watchlist={watchlist} setWatchlist={setWatchlist} navigate={navigate} initialSector={marketSector} />;
      case 'trade':
        return <Trade livePrices={livePrices} portfolio={portfolio} credits={credits} onOrderPlaced={onOrderPlaced} navigate={navigate} initSym={tradeSym} />;
      case 'portfolio':
        return <Portfolio portfolio={portfolio} livePrices={livePrices} onSell={onSell} navigate={navigate} />;
      case 'compass':
        return <Compass portfolio={portfolio} livePrices={livePrices} />;
      case 'orders':
        return <Orders orders={orders} navigate={navigate} />;
      case 'watchlist':
        return <Watchlist watchlist={watchlist} setWatchlist={setWatchlist} livePrices={livePrices} navigate={navigate} />;
      default:
        return <Dashboard livePrices={livePrices} portfolio={portfolio} credits={credits} navigate={navigate} />;
    }
  }

  return (
    <div id="app">
      <Sidebar
        page={page} setPage={setPage} credits={credits}
        portfolio={portfolio} livePrices={livePrices}
        openOrders={openOrderCount}
      />
      <div className="main">
        <Topbar livePrices={livePrices} page={page} navigate={navigate} />
        {renderPage()}
      </div>
      <Toast toasts={toasts} />
      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakColor label="Accent colour" value={t.accent}
          options={['#4070FF','#00C896','#A855F7','#F97316']}
          onChange={v=>setTweak('accent',v)} />
        <TweakSection label="Account" />
        <TweakSelect label="Starting Credits" value={t.credits}
          options={[
            {label:'₹5 Lakh',  value:'500000'},
            {label:'₹10 Lakh', value:'1000000'},
            {label:'₹25 Lakh', value:'2500000'},
            {label:'₹50 Lakh', value:'5000000'},
          ]}
          onChange={v=>{ setTweak('credits',v); setCredits(parseFloat(v)); }} />
        <TweakButton label="Reset Portfolio" onClick={()=>{ setPortfolio(DEMO_PORTFOLIO); addToast('Portfolio reset to demo','b'); }} />
        <TweakButton label="Clear All Orders"  onClick={()=>{ setOrders([]);     addToast('Orders cleared','b'); }} />
        <TweakSection label="Market Feed" />
        <TweakSelect label="Price update speed" value={String(t.speed)}
          options={[
            {label:'Slow (5s)',   value:'5000'},
            {label:'Normal (3s)', value:'3000'},
            {label:'Fast (1s)',   value:'1000'},
          ]}
          onChange={v=>setTweak('speed',parseInt(v))} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
